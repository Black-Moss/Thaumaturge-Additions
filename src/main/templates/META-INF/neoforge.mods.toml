modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"
issueTrackerURL = "https://github.com/Black-Moss/Thaumaturge-Additions/issues"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
logoFile = "logo.png"
authors = "${mod_authors}"
description = "${mod_description}"
displayURL = "https://www.curseforge.com/minecraft/mc-mods/thaumaturge-additions"

[[mixins]]
config = "${mod_id}.travelersbackpack.mixins.json"
requiredMods = ["travelersbackpack"]

[[dependencies.${ mod_id }]]
modId = "neoforge"
type = "required"
versionRange = "[${neo_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${ mod_id }]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${ mod_id }]]
modId = "thaumaturge"
type = "required"
versionRange = "[${thaumaturge_version},)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${ mod_id }]]
modId = "jei"
type = "optional"
versionRange = "[${jei_version},)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${ mod_id }]]
modId = "travelersbackpack"
type = "optional"
versionRange = "[${travelersbackpack_version},)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${ mod_id }]]
modId = "sophisticatedcore"
type = "optional"
versionRange = "[${sophisticatedcore_version},)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${ mod_id }]]
modId = "sophisticatedbackpacks"
type = "optional"
versionRange = "[${sophisticatedbackpacks_version},)"
ordering = "AFTER"
side = "BOTH"
